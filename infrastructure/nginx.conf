# NGINX TLS 1.3 Reverse Proxy for FAOS Backend
# Enforces HTTPS, restricts CORS origins, terminates TLS

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 2G;  # Allow large LiDAR point cloud uploads

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Upstream FastAPI Backend
    upstream faos_backend {
        least_conn;
        server fastapi:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ═══════════════════════════════════════════════════════════
    # HTTP Redirect to HTTPS
    # ═══════════════════════════════════════════════════════════
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ═══════════════════════════════════════════════════════════
    # HTTPS API Gateway (TLS 1.3 Enforced)
    # ═══════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name api.claim2car.com ~^track\.claim2car\.com$;

        # TLS 1.3 Configuration (Let's Encrypt Certificates)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ciphers "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256";
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

        # ─────────────────────────────────────────────────────
        # CORS Origin Whitelist (No Wildcards)
        # ─────────────────────────────────────────────────────
        set $cors_origin "";
        if ($http_origin ~* ^https?://(api|track|app|admin)\.claim2car\.com$) {
            set $cors_origin $http_origin;
        }

        # ─────────────────────────────────────────────────────
        # Rate Limiting (DoS Protection)
        # ─────────────────────────────────────────────────────
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
        limit_req_zone $http_x_device_id zone=device_limit:10m rate=50r/s;
        limit_req zone=api_limit burst=200 nodelay;
        limit_req zone=device_limit burst=100 nodelay;

        # ─────────────────────────────────────────────────────
        # WebSocket Upgrade (For Routing Events)
        # ─────────────────────────────────────────────────────
        map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
        }

        # ─────────────────────────────────────────────────────
        # FastAPI Proxy Configuration
        # ─────────────────────────────────────────────────────
        location / {
            proxy_pass http://faos_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $server_name;

            # Timeouts for large uploads
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Buffering for LiDAR point cloud payloads
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # Connection handling
            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }

        # ─────────────────────────────────────────────────────
        # WebSocket Endpoint (Routing Events)
        # ─────────────────────────────────────────────────────
        location /ws/routing {
            proxy_pass http://faos_backend/ws/routing;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;  # Long-lived WebSocket
        }

        # ─────────────────────────────────────────────────────
        # Health Check Endpoint (No Logging)
        # ─────────────────────────────────────────────────────
        location /api/v1/health {
            proxy_pass http://faos_backend/api/v1/health;
            access_log off;
        }
    }
}
